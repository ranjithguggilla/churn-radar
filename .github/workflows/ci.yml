name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: lint and tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Lint
        run: ruff check src tests

      - name: Format check
        run: ruff format --check src tests

      - name: Tests
        run: pytest --cov=churn_radar --cov-report=term-missing

  docker:
    name: build and smoke-test image
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build -t churn-radar .

      - name: Smoke test
        run: |
          docker run -d --name cr -p 8000:8000 churn-radar
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 1; done
          curl -sf -X POST localhost:8000/predict -H 'Content-Type: application/json' -d '{
            "gender":"Female","SeniorCitizen":0,"Partner":"No","Dependents":"No","tenure":3,
            "PhoneService":"Yes","MultipleLines":"No","InternetService":"Fiber optic",
            "OnlineSecurity":"No","OnlineBackup":"No","DeviceProtection":"No","TechSupport":"No",
            "StreamingTV":"No","StreamingMovies":"No","Contract":"Month-to-month",
            "PaperlessBilling":"Yes","PaymentMethod":"Electronic check","MonthlyCharges":80.0}'
          docker rm -f cr
